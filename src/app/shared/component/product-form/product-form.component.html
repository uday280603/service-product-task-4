<div class="card mb-3">
  <div class="card-body">
    <div class="form-group">
      <label for="productTitle">Product Title</label>
      <input type="text" class="form-control" #productTitle />
    </div>

    <div class="form-group">
      <label for="productdesc">Product Description</label>
      <input type="text" class="form-control" #productdesc />
    </div>
    <button class="btn btn-block btn-outline-info" (click)="onAddProduct()">Add Product </button>
  </div>
</div>
